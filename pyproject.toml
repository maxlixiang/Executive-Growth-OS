[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "executive-growth-os"
version = "0.1.0"
description = "A local-first executive capability growth system"
requires-python = ">=3.13"
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.scripts]
growthos = "growthos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
